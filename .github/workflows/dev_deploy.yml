# GitHub Actions 화면에 표시될 workflow 이름
name: LTE Dev CI/CD

# 언제 이 workflow 을 실행할지 설정
on:
  # Pull Request 와 관련된 이벤트를 감지
  pull_request:
    # PR 이 닫혔을 때 실행
    types:
      - closed
  # 수동 실행할 수 있도록 설정
  workflow_dispatch:

jobs:
  # build 라는 이름의 Job 정의
  build:
    # 임시 우분투 컴퓨터 하나를 빌려서 아래 작업들을 수행한다고 보면 됨
    runs-on: ubuntu-latest

    # Job 을 실제로 실행할 조건
    # 즉, main 브랜치를 대상으로 한 PR 이 실제로 Merge 되었거나
    # workflow_dispatch로 수동 실행했을 때
    if: (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main')
      || github.event_name == 'workflow_dispatch'

    # 하나의 Job 안에서 순서대로 수행할 작업들
    steps:
      # 1. GitHub Repository 의 코드를 Runner 로 가져옴
      - name: Checkout
        uses: actions/checkout@v4

      # 2. GitHub Secret에 저장해둔 LTE_ENV 값을
      # Runner 안의 .env 파일로 생성
      - name: Create .env file from secret
        run: |
          printf '%s' "${{ secrets.LTE_ENV }}" > .env
          chmod 600 .env # .env 파일은 현재 사용자만 읽고 쓸 수 있도록 권한 제한

      # 3. Spring Boot 프로젝트를 빌드하기 위해 JDK 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Linux 환경에서 gradlew를 실행할 수 있도록 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      # 5. Gradle을 이용해 Spring Boot 프로젝트 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test
        shell: bash

      # 6. 배포 버전 이름을 구분하기 위해 현재 시간 가져오기
      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: 'YYYYMMDD-HHmmss'
          utcOffset: '+09:00'

      # 가져온 시간을 로그에서 확인
      - name: Show current time
        run: echo "${{ steps.current-time.outputs.formattedTime }}"
        shell: bash

      # 7. Elastic Beanstalk에 전달할 배포 ZIP 파일 생성
      - name: Generate deployment package
        run: |
          # 배포 파일만 모아둘 deploy 폴더 생성
          mkdir -p deploy

          # Gradle이 만든 실행 JAR를
          # application.jar라는 고정된 이름으로 복사
          cp build/libs/*.jar deploy/application.jar

          # EB가 Spring Boot 실행 방법을 알 수 있도록 Procfile 포함
          cp Procfile deploy/Procfile

          # 애플리케이션 환경 변수 포함
          cp .env deploy/.env

          # EB 설정 파일 포함
          cp -r .ebextensions_dev deploy/.ebextensions

          # Nginx 등 EB 플랫폼 설정 포함
          cp -r .platform deploy/.platform

          # deploy 폴더 내부 내용을 deploy.zip으로 압축
          cd deploy && zip -r deploy.zip .

      # 8. 방금 만든 deploy.zip 안에 필요한 파일들이 제대로 들어갔는지 확인
      - name: Verify deploy zip content
        run: |
          unzip -l deploy/deploy.zip | head -n 50
          unzip -l deploy/deploy.zip | egrep -i "pom.xml|Buildfile|src/|repository/" && exit 1 || echo "OK: no sample source"

      # 9. 완성된 deploy.zip을 Elastic Beanstalk에 배포
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACTION_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_ACTION_SECRET_ACCESS_KEY }}

          # 우리가 앞에서 생성한 것들
          application_name: 'lte-dev'         # EB 애플리케이션 이름
          environment_name: 'Lte-dev-env'     # EB 환경 이름

          # EB에는 배포할 때마다 새로운 Application Version이 생성됨
          # 현재 시간을 붙여 각 버전의 이름을 서로 다르게 만듦
          version_label: github-action-${{ steps.current-time.outputs.formattedTime }}

          region: 'ap-northeast-2'

          deployment_package: 'deploy/deploy.zip'

          # EB 배포가 완료될 때까지 GitHub Actions가 기다림
          wait_for_deployment: true
